name: Multiple Configuration

on:
  push:
  workflow_dispatch: 

jobs: 
  test-python-3.9:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4 
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.9'
      - run: python --version 

  test-python-3.10: 
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python --version

  test-python-3.11:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
      - run: python --version
      
  

      
