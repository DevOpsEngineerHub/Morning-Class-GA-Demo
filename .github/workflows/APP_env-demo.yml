name: APP ENV Demo

on:
  push:
  workflow_dispatch: 

env: 
  APP_ENV: Development

jobs: 
  checkout-code:
    runs-on: ubuntu-latest
    steps:
      - name: Check Workflow Variable
        run: echo "Env: $APP_ENV"

      - name: Override the variable at the step level
        run: echo "Env: $APP_ENV"
        env: 
          APP_ENV: Step-Environment

      - name: check the variable again 
        run: echo "Env: $APP_ENV"

  deploy: 
    runs-on: ubuntu-latest

    env:
      APP_ENV: production 

    steps: 
      - name: Check the job variable
        run: echo "Env: $APP_ENV"

    
