name: Artifacts Demo 

on: 
  workflow_dispatch: 

jobs: 
  test: 
    runs-on: ubuntu-latest

    steps: 
      - name: Create a test Report 
        run: |
          mkdir reports
          echo "All tests are passed" > reports/test-report.txt


      - name: Upload Test Report
        uses: actions/upload-artifact@v4 
        with: 
          name: test-report
          path: reports/test-report.txt
