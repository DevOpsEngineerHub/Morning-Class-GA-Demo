name: Without Caching Demo

on: 
  workflow_dispatch: 

jobs: 
  install: 
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout Code 
        uses: actions/checkout@v4

      - name: Setup python 
        uses: actions/setup-python@v5 
        with: 
          python-version: '3.12'

      - name: install pacckages 
        run: |
          pip install requests flask numpy pandas django

      - name: Check Packages
        run: pip list
