name: Artifacts Demo 2

on: 
  workflow_dispatch: 

jobs: 
  build: 
    runs-on: ubuntu-latest

    steps: 
      - name: Create a test Report 
        run: |
          mkdir build
          echo "Github Actions!!!!" > build/app.txt


      - name: Upload Test Report
        uses: actions/upload-artifact@v4 
        with: 
          name: my-first-artifact
          path: build/

  download: 
    needs: build
    runs-on: ubuntu-latest

    steps: 
      - name: Download the Artifacts 
        uses: actions/download-artifact@v4 
        with: 
          name: my-first-artifact

      - name: Read Artifacts
        run: cat app.txt
